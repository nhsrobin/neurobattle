<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #36d1dc, #5b86e5);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .converter {
      background: #ffffffcc;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .converter h1 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }
    .converter input {
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }
    .converter select {
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .converter button {
      padding: 1rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .converter button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="converter">
    <h1>Distance Unit Converter</h1>
    <input type="number" id="distanceInput" placeholder="Enter distance" min="0">
    <select id="fromUnit">
      <option value="meter">Meter</option>
      <option value="kilometer">Kilometer</option>
      <option value="mile">Mile</option>
      <option value="yard">Yard</option>
      <option value="foot">Foot</option>
      <option value="inch">Inch</option>
    </select>
    <select id="toUnit">
      <option value="meter">Meter</option>
      <option value="kilometer">Kilometer</option>
      <option value="mile">Mile</option>
      <option value="yard">Yard</option>
      <option value="foot">Foot</option>
      <option value="inch">Inch</option>
    </select>
    <button onclick="convertDistance()">Convert</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    const conversionRates = {
      meter: 1,
      kilometer: 0.001,
      mile: 0.000621371,
      yard: 1.09361,
      foot: 3.28084,
      inch: 39.3701
    };

    function convertDistance() {
      const distance = parseFloat(document.getElementById('distanceInput').value);
      const fromUnit = document.getElementById('fromUnit').value;
      const toUnit = document.getElementById('toUnit').value;

      if (isNaN(distance)) {
        document.getElementById('result').textContent = 'Please enter a valid distance.';
        return;
      }

      const distanceInMeters = distance / conversionRates[fromUnit];
      const convertedDistance = distanceInMeters * conversionRates[toUnit];

      document.getElementById('result').textContent = `${distance} ${fromUnit}(s) = ${convertedDistance.toFixed(4)} ${toUnit}(s)`;
    }
  </script>
</body>
</html>
